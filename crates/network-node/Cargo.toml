[package]
name = "network-node"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol", features = ["serde"] }
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }

[dev-dependencies]
rstest = { workspace = true }
