name: Deploy browser lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build WebAssembly engine
        run: |
          wasm-pack build crates/sim-wasm --target no-modules --release
          cp crates/sim-wasm/pkg/sim_wasm.js crates/sim-wasm/pkg/sim_wasm_bg.wasm tools/lab/

      - name: Test lab against the built engine
        run: node --experimental-vm-modules tools/lab/tests/smr_failure.mjs

      - name: Stage site
        run: |
          mkdir _site
          cp tools/lab/*.html tools/lab/*.css tools/lab/*.js tools/lab/*.wasm _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
